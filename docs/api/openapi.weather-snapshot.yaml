        '304':
          description: |
            Not modified. The client sent `If-None-Match: "<snapshotId>"` with its
            cached document, the value matched, so the caller keeps that cached
            document and refreshes its local receipt time. No body is returned
            and no re-render is needed.
          headers:
            ETag:
              description: The unchanged strong validator.
              schema:
                type: string
                pattern: '^"[a-f0-9]{64}"$'
            Cache-Control:
              description: Same fixed freshness hint as the 200 response.
              schema:
                type: string
                const: max-age=300, must-revalidate
        '404':
          description: |
            Unknown location or contract version. No document is returned. The
            client surfaces `HTTP_ERROR`.
        '429':
          description: |
            Rate limited. No snapshot body is required; the client surfaces this
            as `RATE_LIMITED` locally, keeps any cached document, and waits at
            least `Retry-After` seconds before its next attempt.
          headers:
            Retry-After:
              description: Seconds the client must wait before retrying.
              schema:
                type: integer
                minimum: 0
        '5XX':
          description: |
            Producer or upstream unavailable. The client maps this to
            `UPSTREAM_UNAVAILABLE` locally. If `Retry-After` is present it is
            honoured; otherwise the next attempt waits for the next normal
            revalidation point.
          headers:
            Retry-After:
              description: Optional seconds to wait before retrying.
              schema:
                type: integer
                minimum: 0

  /healthz:
    get:
      operationId: getHealth
      tags: [ops]
      summary: Producer liveness
      description: |
        Optional liveness probe for the producer. It returns no weather data and
        is never required by the client.
      responses:
        '200':
          description: Producer is up.
          content:
            text/plain:
              schema:
                type: string
                const: ok
        '503':
          description: Producer is up but cannot serve a recent snapshot.

components:
  schemas:

    WeatherSnapshot:
      type: object
      description: |
        The whole document. One location, one producer, one fetch instant.
        `current`, `hourly` and `daily` are non-null only when `status.ok` is
        `true`.
      additionalProperties: false
      required:
        - schemaVersion
        - kind
        - snapshotId
        - source
        - timing
        - location
        - units
        - current
        - hourly
        - daily
        - status
      properties:
        schemaVersion:
          type: string
          const: '1.0.0'
          description: |
            Contract version as `MAJOR.MINOR.PATCH`. This document defines
            `1.0.0`. A consumer accepts any `1.x.y` and rejects another MAJOR.
        kind:
          type: string
          const: WeatherSnapshot
          description: Discriminator for the document type. Always `WeatherSnapshot`.
        snapshotId:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: |
            Lowercase hex SHA-256 of `<source.id>|<location.id>|<timing.fetchedAt>`,
            equal to the unquoted HTTP `ETag`. The client validates the 64-hex
            format only; hash equality is the producer's responsibility.
        source:
          $ref: '#/components/schemas/SnapshotSource'
        timing:
          $ref: '#/components/schemas/SnapshotTiming'
        location:
          $ref: '#/components/schemas/SnapshotLocation'
        units:
          $ref: '#/components/schemas/WeatherUnits'
        current:
          description: |
            Current conditions, or `null` when `status.ok` is `false`.
          anyOf:
            - $ref: '#/components/schemas/CurrentConditions'
            - type: 'null'
        hourly:
          description: |
            Exactly 24 hourly entries, or `null` when `status.ok` is `false`.
            The client enforces the count (24) and the 3600-second spacing; that
            the first entry is the current local hour is producer-enforced.
          anyOf:
            - type: array
              minItems: 24
              maxItems: 24
              items:
                $ref: '#/components/schemas/HourlyEntry'
            - type: 'null'
        daily:
          description: |
            Exactly 7 daily entries on consecutive local calendar days, or `null`
            when `status.ok` is `false`. The client enforces the count (7) and
            consecutiveness; that `daily[0].date` is the current local date is
            producer-enforced.
          anyOf:
            - type: array
              minItems: 7
              maxItems: 7
              items:
                $ref: '#/components/schemas/DailyEntry'
            - type: 'null'
        alerts:
          description: |
            Optional active alerts for the location. Omitted or empty when there
            are none. Not part of the 24/7 forecast counts.
          type: array
          items:
            $ref: '#/components/schemas/WeatherAlert'
        status:
          $ref: '#/components/schemas/SnapshotStatus'
      allOf:
        - if:
            required: [status]
            properties:
              status:
                required: [ok]
                properties:
                  ok:
                    const: true
          then:
            description: A successful document carries all three forecast blocks.
            properties:
              current:
                $ref: '#/components/schemas/CurrentConditions'
              hourly:
                type: array
                minItems: 24
                maxItems: 24
                items:
                  $ref: '#/components/schemas/HourlyEntry'
              daily:
                type: array
                minItems: 7
                maxItems: 7
                items:
                  $ref: '#/components/schemas/DailyEntry'
          else:
            description: A failed document carries no forecast data at all.
            properties:
              current:
                type: 'null'
              hourly:
                type: 'null'
              daily:
                type: 'null'

    SnapshotSource:
      type: object
      description: |
        Provenance of the document: which producer made it, from where, and under
        which attribution. The client displays `attribution`; it never guesses a
        vendor name.
      additionalProperties: false
      required: [id, producer, attribution, url, licenseNote]
      properties:
        id:
          type: string
          enum: [fixture, pc-pull, phone-scrape, push]
          description: |
            Producer strategy identifier. `fixture` is bundled synthetic data,
            `pc-pull` is a PC fetching and normalising upstream data,
            `phone-scrape` is an on-device scrape (not implemented, blocked by
            an upstream 403), `push` is a future server-initiated feed.
        producer:
          type: string
          enum: [fixture, pc, phone]
          description: |
            Where the normalisation ran. `fixture` for bundled data, `pc` for a
            home computer, `phone` for the device itself.
        attribution:
          type: string
          description: |
            Human-readable credit line naming the upstream data provider. Shown
            in the UI on every screen that renders weather values.
        url:
          type: [string, 'null']
          format: uri
          description: |
            Canonical upstream page or feed the values were derived from, or
            `null` for a bundled fixture. Informational only; the phone does not
            fetch it.
        licenseNote:
          type: string
          description: |
            Short statement of the permitted use (personal, educational,
            read-only, no redistribution) and any upstream terms that apply.

    SnapshotTiming:
      type: object
      description: |
        Time bookkeeping for the document. All four instants are UTC and end in
        `Z`; the local timezone lives in `location.timezone`.
      additionalProperties: false
      required:
        - fetchedAt
        - observedAt
        - issuedAt
        - expiresAt
        - ttlSeconds
        - staleAfterSeconds
      properties:
        fetchedAt:
          type: string
          format: date-time
          pattern: 'Z$'
          description: |
            Instant the producer fetched or generated the upstream data. Part of
            the `snapshotId` input, so it identifies the fetch.
        observedAt:
          type: string
          format: date-time
          pattern: 'Z$'
          description: |
            Instant the upstream observation describes. Usually slightly earlier
            than `fetchedAt`.
        issuedAt:
          type: string
          format: date-time
          pattern: 'Z$'
          description: |
            Instant the upstream provider issued its forecast run.
        expiresAt:
          type: string
          format: date-time
          pattern: 'Z$'
          description: |
            Instant after which the document is `expired` regardless of local
            cache age. The client checks this instant first: it wins over
            `ttlSeconds` and `staleAfterSeconds`. Defaults to `fetchedAt + 6h`.
        ttlSeconds:
          type: integer
          minimum: 60
          default: 1800
          description: |
            Seconds the document stays `fresh` without revalidation. The
            document's own value drives the client; `1800` is only the fallback.
        staleAfterSeconds:
          type: integer
          minimum: 60
          default: 3600
          description: |
            Seconds after which the document is `stale`. Between `ttlSeconds` and
            this value the cached document is still rendered and marked for
            revalidation (stale-while-revalidate). The document's own value
            drives the client; `3600` is only the fallback.

    SnapshotLocation:
      type: object
      description: |
        The single fixed location this contract serves. Multi-location support is
        deliberately out of scope for v1.
      additionalProperties: false
      required: [id, name, country, lat, lon, timezone]
      properties:
        id:
          type: string
          description: Stable slug used in the URL path and in `snapshotId`.
          examples: [necochea-ar]
        name:
          type: string
          description: Display name of the city.
          examples: [Necochea]
        country:
          type: string
          pattern: '^[A-Z]{2}$'
          description: ISO 3166-1 alpha-2 country code.
          examples: [AR]
        lat:
          type: number
          minimum: -90
          maximum: 90
          description: Latitude in decimal degrees, WGS 84.
          examples: [-38.5545]
        lon:
          type: number
          minimum: -180
          maximum: 180
          description: Longitude in decimal degrees, WGS 84.
          examples: [-58.7396]
        timezone:
          type: string
          description: |
            IANA timezone identifier. It defines the local hour used by
            `hourly[].time` offsets and the local calendar day used by
            `daily[].date`.
          examples: [America/Argentina/Buenos_Aires]
        elevationM:
          type: integer
          description: |
            Optional elevation above sea level in metres. Used only for display
            and pressure context; never for a network lookup.
          examples: [17]

    WeatherUnits:
      type: object
      description: |
        The one accepted unit set. Every field is a fixed literal: the client
        compares the whole object for equality and rejects anything else with
        `UNSUPPORTED_UNITS` rather than converting silently.
      additionalProperties: false
      required:
        - temperature
        - windSpeed
        - precipitation
        - precipitationProbability
        - humidity
        - pressure
        - visibility
        - cloudCover
        - uvIndex
      properties:
        temperature:
          type: string
          const: celsius
          description: Temperature in degrees Celsius.
        windSpeed:
          type: string
          const: kmh
          description: Wind and gust speed in kilometres per hour.
        precipitation:
          type: string
          const: mm
          description: Liquid-equivalent precipitation in millimetres.
        precipitationProbability:
          type: string
          const: percent
          description: Probability of precipitation as a percentage (0-100).
        humidity:
          type: string
          const: percent
          description: Relative humidity as a percentage (0-100).
        pressure:
          type: string
          const: hPa
          description: Mean sea-level pressure in hectopascals.
        visibility:
          type: string
          const: km
          description: Visibility distance in kilometres.
        cloudCover:
          type: string
          const: percent
          description: Total cloud cover as a percentage (0-100).
        uvIndex:
          type: string
          const: index
          description: UV index as a unitless index value.

    CurrentConditions:
      type: object
      description: |
        Conditions at `timing.observedAt`. Nullable members are present but
        `null` when the upstream source does not publish them; they are never
        omitted.
      additionalProperties: false
      required:
        - temperature
        - feelsLike
        - condition
        - iconCode
        - humidity
        - wind
        - pressure
        - visibility
        - uvIndex
        - cloudCover
        - precipLastHourMm
        - isDay
      properties:
        temperature:
          type: number
          description: Air temperature in degrees Celsius.
        feelsLike:
          type: number
          description: Apparent temperature in degrees Celsius.
        condition:
          $ref: '#/components/schemas/SnapshotCondition'
        iconCode:
          $ref: '#/components/schemas/IconCode'
        humidity:
          type: number
          minimum: 0
          maximum: 100
          description: Relative humidity as a percentage.
        wind:
          $ref: '#/components/schemas/SnapshotWind'
        pressure:
          type: [number, 'null']
          description: Mean sea-level pressure in hPa, or `null` if unavailable.
        visibility:
          type: [number, 'null']
          minimum: 0
          description: Visibility in kilometres, or `null` if unavailable.
        uvIndex:
          type: [number, 'null']
          minimum: 0
          description: UV index, or `null` if unavailable.
        cloudCover:
          type: [number, 'null']
          minimum: 0
          maximum: 100
          description: Total cloud cover as a percentage, or `null`.
        precipLastHourMm:
          type: [number, 'null']
          minimum: 0
          description: |
            Liquid-equivalent precipitation in the last hour, in millimetres, or
            `null` when the source reports no accumulation.
        isDay:
          type: boolean
          description: |
            Whether the location is in daylight at `timing.observedAt`. Drives
            day/night icon selection, not a separate sun-position query.

    SnapshotCondition:
      type: object
      description: |
        A normalised weather condition: a machine code for logic and a short
        human text for display.
      additionalProperties: false
      required: [code, text]
      properties:
        code:
          $ref: '#/components/schemas/ConditionCode'
        text:
          type: string
          description: |
            Short human-readable description in the producer's chosen language.
            Displayed as-is; the client does not translate it.
          examples: [Parcialmente nublado]

    SnapshotWind:
      type: object
      description: |
        Wind at the observation instant. `speed` is always known; the other
        members may be `null` when the upstream source omits them.
      additionalProperties: false
      required: [speed, gust, directionDeg, directionCardinal]
      properties:
        speed:
          type: number
          minimum: 0
          description: Sustained wind speed in km/h.
        gust:
          type: [number, 'null']
          minimum: 0
          description: Peak gust in km/h, or `null` when not reported.
        directionDeg:
          type: [number, 'null']
          minimum: 0
          maximum: 360
          description: |
            Direction the wind blows from, in meteorological degrees clockwise
            from north (0 = north, 90 = east), or `null`.
        directionCardinal:
          type: [string, 'null']
          pattern: '^[NSEW]{1,3}$'
          description: |
            Cardinal or intercardinal form of `directionDeg` (N, NNE, NE, …,
            NNW), or `null`.

    HourlyEntry:
      type: object
      description: |
        One hour of the forecast. Exactly 24 consecutive entries are required,
        spaced 3600 seconds apart and aligned to the local hour.
      additionalProperties: false
      required:
        - time
        - temperature
        - feelsLike
        - precipProbability
        - precipMm
        - windSpeed
        - windGust
        - conditionCode
        - iconCode
        - isDay
      properties:
        time:
          type: string
          format: date-time
          description: |
            Start of the hour as an ISO-8601 instant carrying the location offset
            (`-03:00` for Necochea), not `Z`.
          examples: ['2026-11-12T15:00:00-03:00']
        temperature:
          type: number
          description: Air temperature in degrees Celsius.
        feelsLike:
          type: number
          description: Apparent temperature in degrees Celsius.
        precipProbability:
          type: number
          minimum: 0
          maximum: 100
          description: Probability of precipitation for the hour, as a percentage.
        precipMm:
          type: number
          minimum: 0
          description: Expected liquid-equivalent precipitation for the hour, in mm.
        windSpeed:
          type: number
          minimum: 0
          description: Sustained wind speed in km/h.
        windGust:
          type: [number, 'null']
          minimum: 0
          description: Peak gust in km/h, or `null` when not reported.
        conditionCode:
          $ref: '#/components/schemas/ConditionCode'
        iconCode:
          $ref: '#/components/schemas/IconCode'
        isDay:
          type: boolean
          description: Whether this hour falls in daylight at the location.

    DailyEntry:
      type: object
      description: |
        One local calendar day. Exactly 7 consecutive days are required, starting
        at the location's current local date.
      additionalProperties: false
      required:
        - date
        - tempMin
        - tempMax
        - precipProbability
        - precipMm
        - sunrise
        - sunset
        - conditionCode
        - iconCode
        - uvIndexMax
        - windSpeedMax
      properties:
        date:
          type: string
          format: date
          description: Local calendar date in `YYYY-MM-DD` form.
          examples: ['2026-11-12']
        tempMin:
          type: number
          description: Forecast minimum air temperature in degrees Celsius.
        tempMax:
          type: number
          description: |
            Forecast maximum air temperature in degrees Celsius. Must be greater
            than or equal to `tempMin` (checked at runtime).
        precipProbability:
          type: number
          minimum: 0
          maximum: 100
          description: Probability of precipitation for the day, as a percentage.
        precipMm:
          type: number
          minimum: 0
          description: Expected liquid-equivalent precipitation for the day, in mm.
        sunrise:
          type: [string, 'null']
          format: date-time
          description: |
            Local sunrise instant with the location offset, or `null` when the
            source does not publish it.
        sunset:
          type: [string, 'null']
          format: date-time
          description: |
            Local sunset instant with the location offset, or `null` when the
            source does not publish it.
        conditionCode:
          $ref: '#/components/schemas/ConditionCode'
        iconCode:
          $ref: '#/components/schemas/IconCode'
        uvIndexMax:
          type: [number, 'null']
          minimum: 0
          description: Peak UV index for the day, or `null` when unavailable.
        windSpeedMax:
          type: number
          minimum: 0
          description: Maximum sustained wind speed for the day, in km/h.

    WeatherAlert:
      type: object
      description: |
        One active advisory or warning for the location. Alerts are optional and
        do not affect the 24/7 counts.
      additionalProperties: false
      required: [id, title, severity, startsAt, endsAt, text]
      properties:
        id:
          type: string
          description: Stable identifier for the alert, unique within a document.
        title:
          type: string
          description: Short headline shown in the alert list.
        severity:
          type: string
          enum: [minor, moderate, severe, extreme, unknown]
          description: |
            Normalised severity. `unknown` is used when the upstream wording does
            not map onto the other four levels.
        startsAt:
          type: string
          format: date-time
          description: Start instant of the alert, UTC with `Z`.
        endsAt:
          type: [string, 'null']
          format: date-time
          description: End instant of the alert, UTC with `Z`, or `null` if open-ended.
        text:
          type: string
          description: Full advisory text as issued by the upstream provider.

    SnapshotStatus:
      type: object
      description: |
        Success discriminator. `ok: true` means the forecast blocks are present;
        `ok: false` means they are `null` and `error` explains why. A failed
        document is never cached as last-known-good.
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
          description: Whether this document carries usable weather data.
        error:
          $ref: '#/components/schemas/SnapshotError'
      allOf:
        - if:
            required: [ok]
            properties:
              ok:
                const: true
          then:
            not:
              required: [error]
        - if:
            required: [ok]
            properties:
              ok:
                const: false
          then:
            required: [error]

    SnapshotError:
      type: object
      description: |
        Structured failure. The code is the contract; the message is for humans
        and logs and must not be parsed.
      additionalProperties: false
      required: [code, message, retryAfterSeconds]
      properties:
        code:
          type: string
          enum:
            - FETCH_BLOCKED
            - HTTP_ERROR
            - PARSE_ERROR
            - SCHEMA_INVALID
            - RATE_LIMITED
            - UPSTREAM_UNAVAILABLE
            - CLOCK_SKEW
            - UNSUPPORTED_SCHEMA_VERSION
            - UNSUPPORTED_UNITS
          description: |
            Machine-readable cause. `FETCH_BLOCKED` is an anti-bot / access
            denial (HTTP 403 class), `HTTP_ERROR` any other non-2xx,
            `PARSE_ERROR` a body that is not JSON, `SCHEMA_INVALID` a JSON body
            that fails the client-validator checks, `RATE_LIMITED` an HTTP 429,
            `UPSTREAM_UNAVAILABLE` a 5xx or transport failure, `CLOCK_SKEW` a
            **producer-side** diagnosis (the client never emits it),
            `UNSUPPORTED_SCHEMA_VERSION` an unknown MAJOR, `UNSUPPORTED_UNITS` a
            non-literal unit set.
        message:
          type: string
          description: Human-readable explanation for logs and diagnostics.
        retryAfterSeconds:
          type: [integer, 'null']
          minimum: 0
          description: |
            Seconds to wait before retrying, taken from `Retry-After` when
            present, otherwise `null`.

    ConditionCode:
      type: string
      description: |
        Normalised condition taxonomy shared by current, hourly and daily data.
        Producers map vendor-specific wording onto these values; `unknown` is the
        fallback rather than an invented code.

        The shipped producer (`apps/weather-radar/scripts/weather-normalize.mjs`)
        normalises Open-Meteo's numeric **WMO `weather_code`**; the table is the
        mapping of record:

        | WMO code(s) | ConditionCode | IconCode |
        | --- | --- | --- |
        | 0, 1 | `clear` | `clear-day` / `clear-night` (from `is_day`) |
        | 2 | `partly-cloudy` | `partly-cloudy-day` / `partly-cloudy-night` |
        | 3 | `overcast` | `overcast` |
        | 45, 48 | `fog` | `fog` |
        | 51, 53, 55 | `drizzle` | `drizzle` |
        | 56, 57 | `sleet` | `sleet` |
        | 61, 63 | `rain` | `rain` |
        | 65 | `heavy-rain` | `heavy-rain` |
        | 66, 67 | `sleet` | `sleet` |
        | 71, 73, 75, 77 | `snow` | `snow` |
        | 80, 81 | `rain` | `rain` |
        | 82 | `heavy-rain` | `heavy-rain` |
        | 85, 86 | `snow` | `snow` |
        | 95, 96, 99 | `thunderstorm` | `thunderstorm` |
        | anything else | `unknown` | `unknown` |

        The es-AR display text is derived from the same code. Day/night variants
        exist only for `clear` and `partly-cloudy`; every other family uses one
        shared icon, and daily entries use the day variant. `wind` has no WMO
        code today, so the shipped table never emits it.

        The mapping belongs to the producer: the app consumes `ConditionCode`
        values and never parses vendor text. A future AccuWeather producer must
        document its own table here before it is enabled.
      enum:
        - clear
        - partly-cloudy
        - cloudy
        - overcast
        - fog
        - drizzle
        - rain
        - heavy-rain
        - thunderstorm
        - sleet
        - snow
        - wind
        - unknown

    IconCode:
      type: string
      description: |
        Icon selector. Day/night variants exist for clear and partly cloudy; the
        other codes are shared. The client maps each code to a local glyph and
        never downloads an icon.
      enum:
        - clear-day
        - clear-night
        - partly-cloudy-day
        - partly-cloudy-night
        - cloudy
        - overcast
        - fog
        - drizzle
        - rain
        - heavy-rain
        - thunderstorm
        - sleet
        - snow
        - wind
        - unknown
