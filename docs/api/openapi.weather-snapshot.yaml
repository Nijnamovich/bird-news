# ---
# last_updated: 2026-11-13
# status: current
# description: OpenAPI 3.1 contract for the provider-agnostic WeatherSnapshot document (Necochea).
# tags: [weather, api, openapi, contract]
# ---
openapi: 3.1.0

info:
  title: Weather Snapshot API
  version: 1.0.0
  summary: Read-only, provider-agnostic weather snapshot for Necochea, Argentina.
  description: |
    A single JSON document carrying current conditions, a 24-hour forecast and a
    7-day forecast for one fixed location. The phone never talks to a weather
    vendor; it reads a snapshot that a producer has already normalised into this
    shape. Two producers are implemented: the bundled `fixture` and the PC pull
    (`pc-pull`). On-device scrape (`phone-scrape`) and server push (`push`) exist
    only as members of the `source.id` vocabulary; nothing implements them.

    **Personal / educational use only.** This contract exists for one private,
    read-only consumer. No redistribution, no public serving, no premium or
    paywall bypass. Attribution is mandatory: every document carries
    `source.attribution` and `source.licenseNote`, and the client displays the
    attribution in the UI. Producers must respect the upstream vendor's terms of
    service and rate limits (see `docs/weather/data-sources.md`).

    **Read-only by construction.** The client performs `GET` only, sends no
    request body, no cookies, no `Authorization` header, no device identifier and
    no user-identifying query parameter. `If-None-Match` is the only request
    header with semantics.

    ### Caching and freshness
    The client's freshness policy is driven by the **document's own** `timing`
    block. The `1800` / `3600` second defaults are fallbacks used only when a
    value is absent.
    - `timing.expiresAt` is checked **first and always wins**: past that instant
      the document is `expired` no matter how recently it arrived.
    - Within `timing.ttlSeconds` the document is `fresh` and is not revalidated.
    - Between `ttlSeconds` and `staleAfterSeconds` the cached document is still
      rendered and marked for revalidation (stale-while-revalidate).
    - After `staleAfterSeconds` — and before `expiresAt` — it is `stale`.
    - Local states are `loading`, `fresh`, `stale`, `expired`, `error`. A cached
      document is purged once its **local receipt age reaches 7 days**
      (inclusive), whatever the producer clock says.
    - `status.ok: false` documents are never cached as last-known-good.

    ### Enforced by the client validator (not expressible in OpenAPI)
    These invariants span fields; the schema below cannot state them:
    1. `hourly` has exactly 24 entries, spaced exactly 3600 seconds apart and
       aligned to the top of the local hour.
    2. `daily` has exactly 7 entries whose `date` values are consecutive local
       calendar days.
    3. `tempMin <= tempMax` for every daily entry.
    4. `timing.*`, `alerts[].startsAt` and `alerts[].endsAt` are exactly-UTC
       instants ending in `Z`; `hourly[].time`, `daily[].sunrise` and
       `daily[].sunset` carry a numeric location offset (`-03:00`).
    5. `units` equals the fixed map in `WeatherUnits` field for field; any other
       unit set is rejected rather than converted.
    6. `status.ok` and nullability agree in both directions: `ok: true` carries
       `current`, `hourly` and `daily`; `ok: false` carries all three as `null`.
    7. An `ok: true` document must not carry `status.error`.
    8. Numeric ranges: humidity, cloud cover and every probability are 0–100,
       `wind.directionDeg` is 0–360; `ttlSeconds` and `staleAfterSeconds` are
       integers.
    9. `snapshotId` matches `^[a-f0-9]{64}$` — the **format only** (see below).
    10. `schemaVersion` is `MAJOR.MINOR.PATCH`; any `1.x.y` is accepted and an
        unknown MAJOR is rejected with `UNSUPPORTED_SCHEMA_VERSION`.

    ### Producer-enforced, not client-checked
    - **`snapshotId` hash equality.** The value must be the lowercase hex SHA-256
      of `<source.id>|<location.id>|<timing.fetchedAt>`. The client checks the
      64-hex format only; computing and keeping the hash correct is the
      producer's responsibility. Because producers are expected to expose the
      same string as the `ETag`, a wrong hash breaks conditional `GET` but never
      makes a valid document render incorrectly.
    - **`daily[0].date` is the location's current local date.** The client checks
      that the seven dates are consecutive, not that the first one is today.

    ### Conditional GET and error mapping at the transport layer
    The client sends `If-None-Match: "<snapshotId>"` for the document it already
    holds and maps the response like this:
    - `304` — not modified: keep the cached document and refresh its local
      receipt time.
    - `404` — unknown location or contract version; surface as `HTTP_ERROR`.
    - `429` — rate limited; surface as `RATE_LIMITED` and honour `Retry-After`.
    - Any other non-`200` — surface as `HTTP_ERROR`.
    - `5xx`, a network failure or a timeout — surface as `UPSTREAM_UNAVAILABLE`,
      honouring `Retry-After` when present.
    - A `200` body that is not valid JSON is `PARSE_ERROR`; valid JSON that fails
      the checks listed under "Enforced by the client validator" is `SCHEMA_INVALID`.
    - Redirects are refused (`redirect: 'error'`), and a base URL that is not
      `https://` is rejected before any request is made.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: https://weather.example.invalid
    description: |
      Placeholder for the human's stable host (a named tunnel with a custom
      domain, never a quick tunnel — see docs/weather/data-sources.md). The
      `example.invalid` TLD is intentionally unresolvable (RFC 2606) so this
      file cannot be used to contact a real service by accident.

security: []

tags:
  - name: snapshot
    description: The weather snapshot document.
  - name: ops
    description: Liveness of the producer.

paths:
  /weather/necochea/v1/latest.json:
    get:
      operationId: getLatestWeatherSnapshot
      tags: [snapshot]
      summary: Latest normalised weather snapshot for Necochea
      description: |
        Returns the newest complete `WeatherSnapshot` for `necochea-ar`.
        Stateless and unauthenticated. Supports conditional `GET`: the client
        sends `If-None-Match: "<snapshotId>"` for the document it already holds
        and receives `304` when nothing changed. The client persists the last
        pull-sourced success on the device, paints it before the first frame of
        a later cold start, and revalidates it with that `snapshotId`; a `304`
        keeps the document and only resets its local receipt time.

        The producer must not run more often than once every 30 minutes; this
        repository ships no scheduler, so the command is invoked by hand or by
        the operator's own cron. The client revalidates once per cold start and
        on a return to the foreground only when the held document is stale.
        Pull-to-refresh remains a follow-up, and there is no polling timer.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: |
            The client's current `snapshotId`, wrapped in double quotes (the same
            string as the `ETag`). When it matches the current document the
            server answers `304 Not Modified` with no body and the client keeps
            its cached copy.
          schema:
            type: string
            examples:
              - '"3850e1166ef8e904120acf491400b7a5bd929632d45c1594c927633e83c161e8"'
      responses:
        '200':
          description: |
            A complete snapshot. `status.ok` may be `false`; in that case the
            forecast fields are `null` and the document still validates.
          headers:
            ETag:
              description: |
                Strong validator, equal to the document's `snapshotId` wrapped in
                double quotes. Changes whenever the producer emits a new
                `snapshotId` (that is, a new fetch).
              schema:
                type: string
                pattern: '^"[a-f0-9]{64}"$'
            Cache-Control:
              description: |
                Fixed freshness hint for intermediaries. The client still applies
                its own `timing.ttlSeconds` / `staleAfterSeconds` logic.
              schema:
                type: string
                const: max-age=300, must-revalidate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeatherSnapshot'
